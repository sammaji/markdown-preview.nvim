name: release

# Builds the server for every platform mkdp#util#install() knows about and
# attaches the archives to the GitHub release of the pushed tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: markdown-preview-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            name: markdown-preview-macos
          - os: macos-latest
            target: aarch64-apple-darwin
            name: markdown-preview-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: markdown-preview-win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # build.rs builds the preview page in app/
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/markdown-preview ${{ matrix.name }}
          tar -czf ${{ matrix.name }}.tar.gz ${{ matrix.name }}
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/${{ matrix.target }}/release/markdown-preview.exe ${{ matrix.name }}.exe
          Compress-Archive -Path ${{ matrix.name }}.exe -DestinationPath ${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.*z*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
