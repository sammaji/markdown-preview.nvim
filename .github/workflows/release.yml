name: release

# Builds the server for every platform mkdp#util#install() knows about and
# attaches the archives to the GitHub release of the pushed tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: markdown-preview-linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            name: markdown-preview-linux-arm64
          # cross-compiled in cross's FreeBSD image, see Cross.toml
          - os: ubuntu-latest
            target: x86_64-unknown-freebsd
            name: markdown-preview-freebsd
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            name: markdown-preview-macos
          - os: macos-latest
            target: aarch64-apple-darwin
            name: markdown-preview-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: markdown-preview-win
    runs-on: ${{ matrix.os }}
    # a FreeBSD build failure must not hold back the release of the others
    continue-on-error: ${{ matrix.cross == true }}
    steps:
      - uses: actions/checkout@v5
      # build.rs builds the preview page in app/
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      # the cross image has no Node.js, so build the page here and embed it
      - if: matrix.cross
        run: |
          pnpm --dir app run build
          cargo install cross --locked
          MKDP_SKIP_PAGE_BUILD=1 cross build --release --locked --target ${{ matrix.target }}
      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/markdown-preview ${{ matrix.name }}
          tar -czf ${{ matrix.name }}.tar.gz ${{ matrix.name }}
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/${{ matrix.target }}/release/markdown-preview.exe ${{ matrix.name }}.exe
          Compress-Archive -Path ${{ matrix.name }}.exe -DestinationPath ${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.*z*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
            *.zip
