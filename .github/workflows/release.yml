name: release

# Builds the server for every platform mkdp#util#install() knows about and
# attaches the archives to the GitHub release of the pushed tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The plugin downloads the release matching its Cargo.toml version, so a tag
  # that disagrees publishes binaries that no installation will ever ask for.
  # Fail before spending the build matrix on them.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)
          case "$GITHUB_REF_NAME" in
            "v$version"|"v$version-"*)
              echo "tag $GITHUB_REF_NAME matches Cargo.toml version $version" ;;
            *)
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
              exit 1 ;;
          esac
      - uses: dtolnay/rust-toolchain@stable
      # the build below runs with --locked, which refuses a stale lockfile;
      # catch that here instead of in four platform jobs
      - name: Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: markdown-preview-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            name: markdown-preview-macos
          - os: macos-latest
            target: aarch64-apple-darwin
            name: markdown-preview-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: markdown-preview-win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # build.rs builds the preview page in app/
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/markdown-preview ${{ matrix.name }}
          tar -czf ${{ matrix.name }}.tar.gz ${{ matrix.name }}
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/${{ matrix.target }}/release/markdown-preview.exe ${{ matrix.name }}.exe
          Compress-Archive -Path ${{ matrix.name }}.exe -DestinationPath ${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.*z*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
            *.zip
